name: publish-release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - build-x64
      - build-x86
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-release-context:
    name: Resolve release context
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest

    outputs:
      ready: ${{ steps.context.outputs.ready }}
      publishable: ${{ steps.runs.outputs.publishable }}
      target_tag: ${{ steps.context.outputs.target_tag }}
      target_sha: ${{ steps.context.outputs.target_sha }}
      x64_run_id: ${{ steps.runs.outputs.x64_run_id }}
      x86_run_id: ${{ steps.runs.outputs.x86_run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags origin

      - name: Resolve target
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Event:              $EVENT_NAME"
          echo "Ref type:           $REF_TYPE"
          echo "Ref name:           $REF_NAME"
          echo "Workflow SHA:       $WORKFLOW_SHA"
          echo "Workflow branch:    $WORKFLOW_BRANCH"
          echo "Workflow repository: $WORKFLOW_REPOSITORY"
          echo

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "::error::Manual publishing must be run against a tag."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_tag="$REF_NAME"

            if ! git rev-parse --verify "refs/tags/$target_tag" >/dev/null 2>&1; then
              echo "::error::Tag does not exist locally: $target_tag"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_sha="$(git rev-list -n 1 "refs/tags/$target_tag")"

          else
            if [[ "$WORKFLOW_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo "::warning::Workflow was triggered by a fork."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_sha="$WORKFLOW_SHA"

            if [[ -z "$target_sha" ]]; then
              echo "::warning::workflow_run did not provide a SHA."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Find a tag pointing exactly at the workflow's SHA.
            target_tag=""

            while IFS= read -r tag; do
              if [[ -n "$tag" ]]; then
                tag_sha="$(git rev-list -n 1 "refs/tags/$tag")"

                if [[ "$tag_sha" == "$target_sha" ]]; then
                  target_tag="$tag"
                  break
                fi
              fi
            done < <(git for-each-ref \
              --format='%(refname:strip=2)' \
              refs/tags)

            if [[ -z "$target_tag" ]]; then
              echo "::warning::No tag points to SHA $target_sha."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo
          echo "========================================"
          echo "Resolved release"
          echo "========================================"
          echo "Tag: $target_tag"
          echo "SHA: $target_sha"
          echo "========================================"

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha"

      - name: Locate successful builds
        id: runs
        if: ${{ steps.context.outputs.ready == 'true' }}
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        with:
          script: |
            const workflows = [
              {
                key: 'x64',
                file: 'build-x64.yml',
              },
              {
                key: 'x86',
                file: 'build-x86.yml',
              },
            ];

            const targetSha = process.env.TARGET_SHA;

            let publishable = true;

            core.info(`Target SHA: ${targetSha}`);
            core.info('');

            for (const workflow of workflows) {
              core.info(`========== ${workflow.key} ==========`);

              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.file,
                head_sha: targetSha,
                status: 'completed',
                per_page: 100,
              });

              core.info(
                `Found ${data.workflow_runs.length} completed run(s)`
              );

              for (const run of data.workflow_runs) {
                core.info(
                  JSON.stringify({
                    id: run.id,
                    run_number: run.run_number,
                    status: run.status,
                    conclusion: run.conclusion,
                    event: run.event,
                    head_sha: run.head_sha,
                    head_branch: run.head_branch,
                    created_at: run.created_at,
                    url: run.html_url,
                  })
                );
              }

              const successful = data.workflow_runs
                .filter(run =>
                  run.head_sha === targetSha &&
                  run.conclusion === 'success'
                )
                .sort(
                  (a, b) =>
                    Date.parse(b.created_at) -
                    Date.parse(a.created_at)
                );

              if (successful.length === 0) {
                core.error(
                  `NO SUCCESSFUL ${workflow.key} BUILD FOUND`
                );

                publishable = false;
                continue;
              }

              const selected = successful[0];

              core.info('');
              core.info(
                `Selected ${workflow.key}: ${selected.id}`
              );
              core.info(
                `URL: ${selected.html_url}`
              );

              core.setOutput(
                `${workflow.key}_run_id`,
                String(selected.id)
              );
            }

            core.setOutput(
              'publishable',
              publishable ? 'true' : 'false'
            );

            core.info('');
            core.info(
              `FINAL publishable=${publishable}`
            );

      - name: Debug outputs
        if: always()
        env:
          READY: ${{ steps.context.outputs.ready }}
          PUBLISHABLE: ${{ steps.runs.outputs.publishable }}
          TARGET_TAG: ${{ steps.context.outputs.target_tag }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          X64_RUN_ID: ${{ steps.runs.outputs.x64_run_id }}
          X86_RUN_ID: ${{ steps.runs.outputs.x86_run_id }}
        run: |
          echo "========================================"
          echo "FINAL RELEASE CONTEXT"
          echo "========================================"
          echo "ready=$READY"
          echo "publishable=$PUBLISHABLE"
          echo "target_tag=$TARGET_TAG"
          echo "target_sha=$TARGET_SHA"
          echo "x64_run_id=$X64_RUN_ID"
          echo "x86_run_id=$X86_RUN_ID"
          echo "========================================"

  publish-release:
    name: Publish GitHub release
    needs: resolve-release-context

    if: >-
      ${{
        needs.resolve-release-context.outputs.ready == 'true' &&
        needs.resolve-release-context.outputs.publishable == 'true'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Show release context
        env:
          TARGET_TAG: ${{ needs.resolve-release-context.outputs.target_tag }}
          TARGET_SHA: ${{ needs.resolve-release-context.outputs.target_sha }}
          X64_RUN_ID: ${{ needs.resolve-release-context.outputs.x64_run_id }}
          X86_RUN_ID: ${{ needs.resolve-release-context.outputs.x86_run_id }}
        run: |
          echo "Target tag: $TARGET_TAG"
          echo "Target SHA: $TARGET_SHA"
          echo "x64 run: $X64_RUN_ID"
          echo "x86 run: $X86_RUN_ID"

      - name: Download x64 package
        uses: actions/download-artifact@v8
        with:
          name: chromium
          path: artifacts/x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.x64_run_id }}

      - name: Download x86 package
        uses: actions/download-artifact@v8
        with:
          name: chromium-x86
          path: artifacts/x86
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.x86_run_id }}

      - name: Show downloaded artifacts
        run: |
          echo "========================================"
          echo "Downloaded artifacts"
          echo "========================================"

          find artifacts \
            -type f \
            -maxdepth 5 \
            -print

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release-context.outputs.target_tag }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/**/ungoogled-chromium*
