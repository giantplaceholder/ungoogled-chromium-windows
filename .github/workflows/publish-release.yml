name: publish-release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - build-x64
      - build-x86
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-release-context:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest

    outputs:
      ready: ${{ steps.context.outputs.ready }}
      publishable: ${{ steps.runs.outputs.publishable }}
      target_tag: ${{ steps.context.outputs.target_tag }}
      target_sha: ${{ steps.context.outputs.target_sha }}
      x64_run_id: ${{ steps.runs.outputs.x64_run_id }}
      x86_run_id: ${{ steps.runs.outputs.x86_run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Resolve target tag
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail

          echo "Event: $EVENT_NAME"
          echo "Ref type: $DISPATCH_REF_TYPE"
          echo "Ref name: $DISPATCH_REF_NAME"
          echo "SHA: $DISPATCH_SHA"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_REF_TYPE" != "tag" ]; then
              echo "::error::Manual publish must be run on a tag."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_tag="$DISPATCH_REF_NAME"
            target_sha="$DISPATCH_SHA"

          else
            if [ "$WORKFLOW_RUN_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "::warning::Triggered by a fork run; skipping publish."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_sha="$WORKFLOW_RUN_HEAD_SHA"
            candidate_tag="$WORKFLOW_RUN_HEAD_BRANCH"

            echo "Workflow run SHA: $target_sha"
            echo "Workflow run branch: $candidate_tag"
            echo "Workflow run repository: $WORKFLOW_RUN_HEAD_REPOSITORY"

            if [ -z "$candidate_tag" ]; then
              echo "::warning::Workflow run has no head branch/tag."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! git rev-parse -q --verify "refs/tags/$candidate_tag" >/dev/null; then
              echo "::warning::$candidate_tag is not a tag in this repository."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            tag_sha="$(git rev-list -n 1 "$candidate_tag")"

            if [ "$tag_sha" != "$target_sha" ]; then
              echo "::warning::Tag $candidate_tag points to $tag_sha, not $target_sha."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_tag="$candidate_tag"
          fi

          echo "Resolved target tag: $target_tag"
          echo "Resolved target SHA: $target_sha"

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Locate successful builds
        id: runs
        if: ${{ steps.context.outputs.ready == 'true' }}
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        with:
          script: |
            const workflows = [
              {
                key: 'x64',
                file: 'build-x64.yml',
              },
              {
                key: 'x86',
                file: 'build-x86.yml',
              },
            ];

            const targetSha = process.env.TARGET_SHA;

            const outputs = {
              publishable: 'true',
            };

            core.info(`Looking for builds at SHA: ${targetSha}`);

            for (const workflow of workflows) {
              core.info(`Searching ${workflow.file}...`);

              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.file,
                head_sha: targetSha,
                status: 'completed',
                per_page: 100,
              });

              core.info(
                `${workflow.file}: GitHub returned ${data.workflow_runs.length} run(s)`
              );

              for (const run of data.workflow_runs) {
                core.info(
                  JSON.stringify({
                    id: run.id,
                    run_number: run.run_number,
                    head_sha: run.head_sha,
                    head_branch: run.head_branch,
                    event: run.event,
                    status: run.status,
                    conclusion: run.conclusion,
                    created_at: run.created_at,
                    html_url: run.html_url,
                  })
                );
              }

              const successfulRuns = data.workflow_runs
                .filter((run) => run.conclusion === 'success')
                .sort(
                  (a, b) =>
                    Date.parse(b.created_at) -
                    Date.parse(a.created_at)
                );

              const latest = successfulRuns[0];

              if (!latest) {
                core.error(
                  `No successful ${workflow.file} run found for SHA ${targetSha}`
                );

                outputs.publishable = 'false';
                continue;
              }

              core.info(
                `Selected ${workflow.file} run ${latest.id}`
              );

              core.info(
                `URL: ${latest.html_url}`
              );

              outputs[`${workflow.key}_run_id`] =
                String(latest.id);
            }

            core.info(
              `publishable=${outputs.publishable}`
            );

            core.setOutput(
              'publishable',
              outputs.publishable
            );

            if (outputs.x64_run_id) {
              core.setOutput(
                'x64_run_id',
                outputs.x64_run_id
              );
            }

            if (outputs.x86_run_id) {
              core.setOutput(
                'x86_run_id',
                outputs.x86_run_id
              );
            }

      - name: Debug resolved outputs
        if: always()
        env:
          READY: ${{ steps.context.outputs.ready }}
          PUBLISHABLE: ${{ steps.runs.outputs.publishable }}
          TARGET_TAG: ${{ steps.context.outputs.target_tag }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          X64_RUN_ID: ${{ steps.runs.outputs.x64_run_id }}
          X86_RUN_ID: ${{ steps.runs.outputs.x86_run_id }}
        run: |
          echo "========================================"
          echo "Release context"
          echo "========================================"
          echo "ready=$READY"
          echo "publishable=$PUBLISHABLE"
          echo "target_tag=$TARGET_TAG"
          echo "target_sha=$TARGET_SHA"
          echo "x64_run_id=$X64_RUN_ID"
          echo "x86_run_id=$X86_RUN_ID"
          echo "========================================"

  publish-release:
    needs: resolve-release-context

    if: >-
      ${{
        needs.resolve-release-context.outputs.ready == 'true' &&
        needs.resolve-release-context.outputs.publishable == 'true'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Show release context
        env:
          TARGET_TAG: ${{ needs.resolve-release-context.outputs.target_tag }}
          TARGET_SHA: ${{ needs.resolve-release-context.outputs.target_sha }}
          X64_RUN_ID: ${{ needs.resolve-release-context.outputs.x64_run_id }}
          X86_RUN_ID: ${{ needs.resolve-release-context.outputs.x86_run_id }}
        run: |
          echo "Target tag: $TARGET_TAG"
          echo "Target SHA: $TARGET_SHA"
          echo "x64 run: $X64_RUN_ID"
          echo "x86 run: $X86_RUN_ID"

      - name: Download x64 package
        uses: actions/download-artifact@v8
        with:
          name: chromium
          path: artifacts/x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.x64_run_id }}

      - name: Download x86 package
        uses: actions/download-artifact@v8
        with:
          name: chromium-x86
          path: artifacts/x86
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.x86_run_id }}

      - name: Show downloaded artifacts
        run: |
          echo "Downloaded files:"
          find artifacts -type f -maxdepth 5 -print

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release-context.outputs.target_tag }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/**/ungoogled-chromium*
